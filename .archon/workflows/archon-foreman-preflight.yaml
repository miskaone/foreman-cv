name: archon-foreman-preflight
description: |
  Use when: the user wants to vet a Linear issue before paying implementation cost. Tightens the issue via a bounded grill-me interview, decides if it needs decomposition, and plans within-issue task fan-out.
  Triggers: "preflight MIS-XXXX", "preflight this issue", "tighten this issue".
  Does: Reads a Linear issue → interactive grill-limited loop (max 5 questions) → structured decomposition decision → cancel-on-split OR within-issue parallelization plan → emits dispatch-plan.json for the implement workflow to consume.
  NOT for: bug-fix workflows (use archon-fix-github-issue), feature implementation (use archon-foreman-implement after this preflight succeeds), Roboflow training (manual, not in Archon's path).

# Vendor-agnostic — omit `provider:` and `model:` to inherit from .archon/config.yaml or per-invocation --provider.
# This workflow is read-only relative to the codebase; we set worktree to false to avoid copy cost.
worktree:
  enabled: false

# Required for the interactive grill-limited loop to deliver gate messages on the web UI.
interactive: true

provider: codex
model: gpt-5.5

nodes:
  # ── BASH NODE: Fetch the Linear issue via GraphQL ──
  # Requires $LINEAR_API_KEY in the subprocess env (inject via op run --env-file=.env.op
  # or via .archon/config.yaml env block).
  - id: fetch-issue
    bash: |
      set -euo pipefail
      issue_id="$ARGUMENTS"
      if [ -z "$issue_id" ]; then
        echo "missing Linear issue ID (e.g. MIS-1168)" >&2
        exit 1
      fi
      if [ -z "${LINEAR_API_KEY:-}" ]; then
        echo "missing LINEAR_API_KEY env var (run via: op run --env-file=.env.op -- ...)" >&2
        exit 1
      fi
      curl -fsS -X POST https://api.linear.app/graphql \
        -H "Authorization: $LINEAR_API_KEY" \
        -H "Content-Type: application/json" \
        --data "$(printf '{"query":"query { issue(id: \\"%s\\") { identifier title description state { name } project { name } team { key name } } }"}' "$issue_id")" \
        | tee "$ARTIFACTS_DIR/issue.json"
    timeout: 20000

  # ── LOOP NODE: Bounded interactive grill ──
  # Asks one clarifying question per iteration, max 5. Human types answer between iterations.
  # The AI exits early via <promise>TIGHT</promise> when it has sufficient understanding,
  # or when the human signals "enough".
  - id: grill-limited
    depends_on: [fetch-issue]
    idle_timeout: 600000
    loop:
      prompt: |
        You are tightening a Linear issue before any implementation work is started.

        Current issue context (from Linear API):
        $fetch-issue.output

        Conversation so far in this grilling session:
        $LOOP_USER_INPUT

        Walk down the decision tree for implementing this issue, one question at a time. For each question:
        - Ask ONE concrete clarifying question that has a real downstream implication (not cosmetic).
        - Provide your recommended answer + the reasoning + one sentence on the tradeoff or counter-argument.
        - Skip questions whose answer is "accept the default" — those aren't worth a round-trip.

        Hard cap: 5 questions total across this loop. The runtime will stop you at 5 even if you don't signal.

        Exit conditions — output the literal token <promise>TIGHT</promise> on its own line when ANY of:
        - The decision tree for this specific issue is sufficiently resolved.
        - The human typed "enough", "stop", or "tight enough".
        - You've already asked 5 questions and the human has answered each.

        Stay focused on this specific issue. Don't ask about scope outside the issue body.
      until: TIGHT
      max_iterations: 5
      fresh_context: false
      interactive: true
      gate_message: |
        Answer the question above (or type "enough" to stop grilling).

  # ── PROMPT NODE: Decomposition decision (structured output) ──
  # Read-only judgment call: should this issue be split into child issues, or proceed as-is?
  - id: decomposition-check
    depends_on: [grill-limited]
    prompt: |
      Decide whether this Linear issue should be implemented as a single unit of work, or split into smaller child issues before any implementation begins.

      Original issue (Linear API output):
      $fetch-issue.output

      Outcome of the grilling session (last iteration only):
      $grill-limited.output

      Split if ANY of:
      - Estimated effort > 4 hours of focused work
      - Touches multiple distinct file domains (e.g., model training code AND deploy code AND docs)
      - Multiple acceptance criteria that could fail independently of each other
      - Depends on un-merged work that doesn't yet exist in main

      Otherwise: proceed.

      If splitting, propose 2-5 child issue titles. Keep titles imperative and specific ("Train RF-DETR Small on the no-aug v1 dataset version", not "Training stuff").
    # Claude-only fields; Codex ignores. Documents intent: this node is pure judgment, no tools.
    denied_tools: [Write, Edit, Bash]
    output_format:
      type: object
      properties:
        decision:
          type: string
          enum: [proceed, split]
        reason:
          type: string
        child_issues:
          type: array
          items:
            type: string
      required: [decision, reason]

  # ── CANCEL NODE: Stop the workflow cleanly if the issue needs decomposition ──
  # Cancelled runs do not auto-resume (unlike failures), which is the right semantics here.
  - id: stop-if-split
    cancel: "Issue needs decomposition before implementation. See $ARTIFACTS_DIR run output or the decomposition-check node output for the proposed child issue titles."
    depends_on: [decomposition-check]
    when: "$decomposition-check.output.decision == 'split'"

  # ── PROMPT NODE: Within-issue parallelization plan (structured output) ──
  # Only runs on the proceed branch. Identifies sub-tasks that can fan out.
  - id: parallelization-check
    depends_on: [decomposition-check]
    when: "$decomposition-check.output.decision == 'proceed'"
    prompt: |
      Plan the within-issue task fan-out for this Linear issue.

      Original issue:
      $fetch-issue.output

      Tightened understanding from grilling:
      $grill-limited.output

      Identify discrete tasks inside this single issue that could run in parallel (different files / independent acceptance criteria), versus tasks that must run sequentially.

      For each task:
      - id: short kebab-case identifier
      - description: one-sentence imperative description of the work
      - depends_on: list of earlier task ids that must complete first (empty if independent)

      Most issues are sequential (one or two tasks, run them in order). A small minority benefit from fan-out (e.g. "write the script + write the test file" can run in parallel).

      agent_count: 1 for sequential, N for parallelizable.
    denied_tools: [Write, Edit, Bash]
    output_format:
      type: object
      properties:
        tasks:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              description:
                type: string
              depends_on:
                type: array
                items:
                  type: string
            required: [id, description]
        can_parallelize:
          type: boolean
        agent_count:
          type: integer
          minimum: 1
      required: [tasks, can_parallelize, agent_count]

  # ── SCRIPT NODE: Emit dispatch-plan.json for the implement workflow ──
  # The script substitution rules: $nodeId.output is inserted RAW into the script body.
  # Because the upstream nodes set output_format, the substituted values are valid JS
  # object literals — direct assignment works without JSON.parse or String.raw.
  - id: emit-plan
    depends_on: [parallelization-check]
    runtime: bun
    timeout: 10000
    script: |
      import { writeFileSync } from "node:fs";
      import { join } from "node:path";

      const decomposition = $decomposition-check.output;
      const parallelization = $parallelization-check.output;

      const plan = {
        decomposition,
        parallelization,
        timestamp: new Date().toISOString(),
      };

      const outPath = join("$ARTIFACTS_DIR", "dispatch-plan.json");
      writeFileSync(outPath, JSON.stringify(plan, null, 2));
      console.log(JSON.stringify({
        status: "ok",
        path: outPath,
        tasks: parallelization?.tasks?.length ?? 0,
        can_parallelize: parallelization?.can_parallelize ?? false,
      }));
