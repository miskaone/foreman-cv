# Project-scoped Archon config
# Inherits defaults from ~/.archon/config.yaml.
# Reference: https://archon.diy/reference/configuration/
#
# Examples:
#   assistants:
#     claude:
#       model: sonnet
#   docs:
#     path: docs
# Session default: route repo Archon AI nodes through Codex unless a workflow
# explicitly overrides provider.
assistant: codex

assistants:
  codex:
    model: gpt-5.3-codex
    modelReasoningEffort: medium

